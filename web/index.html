<!doctype html>
<html lang="en" class="theme-monochrome">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22black%22/><text x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-family=%22Arial,Helvetica,sans-serif%22 font-size=%2258%22 font-weight=%22700%22 fill=%22white%22>R</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskLens | Institutional Credit Risk</title>
  <script>
    (() => {
      const mode = localStorage.getItem('risklens-color-mode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const useDark = mode === 'dark' || (mode !== 'light' && prefersDark);
      document.documentElement.classList.toggle('dark', useDark);
    })();
  </script>
</head>

<body>
  <div class="bg-gradient-sphere bg-sphere-1"></div>
  <div class="bg-gradient-sphere bg-sphere-2"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
