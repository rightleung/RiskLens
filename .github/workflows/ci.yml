name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: risklens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Verify bundled font assets
        run: test -s src/assets/fonts/NotoSansCJK-Regular.ttc && test -s src/assets/fonts/NotoSansCJK-Bold.ttc && test -s src/assets/fonts/OFL.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel

  frontend:
    name: Frontend lint, build, and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser preflight
        run: npm run e2e:preflight

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[dev]"
          pip-audit
          pip-audit -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org && npm audit --audit-level=high --registry=https://registry.npmjs.org
